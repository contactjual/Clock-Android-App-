name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # This repo only ships lib/ and pubspec.yaml. We generate a
      # throwaway scaffold app to get the android/ and ios/ platform
      # folders Flutter needs, then copy just those folders in here.
      - name: Generate platform folders (android/ios)
        run: |
          flutter create --project-name world_clock_app --org com.example.worldclock _scaffold
          rsync -a _scaffold/android/ ./android/
          rsync -a _scaffold/ios/ ./ios/
          rm -rf _scaffold

      - name: Lock the app to landscape orientation
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="landscape"/' "$MANIFEST"
          cat "$MANIFEST"

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: world-clock-apk
          path: build/app/outputs/flutter-apk/app-release.apk
